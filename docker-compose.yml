services:
  ecommerce-client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:3000/api}
    image: ecommerce-client:latest
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "${PORT:-4173}:4173"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://localhost:3000/api}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
